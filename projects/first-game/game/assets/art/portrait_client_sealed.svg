  <path d="M112 256H272M112 276H240M112 296H256" stroke="#24211d" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M128 346H272" stroke="#8a3f24" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- unnumbered order mark: an empty number box -->
